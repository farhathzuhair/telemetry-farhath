<!DOCTYPE html>
<html>

<head>

<title>Telemetry Control Panel</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#020617;
padding:20px;
box-sizing:border-box;
}

.sidebar h2{
margin-top:0;
color:#38bdf8;
}

.menu{
margin-top:30px;
}

.menu div{
padding:10px;
margin-bottom:10px;
background:#111827;
border-radius:6px;
cursor:pointer;
}

.menu div:hover{
background:#1f2937;
}

/* MAIN */

.main{
flex:1;
padding:20px;
overflow:auto;
}

/* STATUS BAR */

.status{
display:flex;
gap:20px;
margin-bottom:20px;
}

.statusBox{
background:#111827;
padding:15px;
border-radius:10px;
flex:1;
}

.statusTitle{
font-size:12px;
color:#9ca3af;
}

.statusValue{
font-size:26px;
margin-top:5px;
}

/* GAUGE */

.gaugeContainer{
display:flex;
gap:20px;
margin-bottom:20px;
flex-wrap:wrap;
}

.gauge{
background:#111827;
padding:20px;
border-radius:10px;
width:180px;
text-align:center;
}

.progress{
width:120px;
height:120px;
border-radius:50%;
background:conic-gradient(#22c55e 0deg,#1f2937 0deg);
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

/* GRAPH */

.graph{
background:#111827;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

/* LOG */

.log{
background:#111827;
padding:20px;
border-radius:10px;
height:200px;
overflow:auto;
font-size:12px;
}

</style>

</head>


<body>


<div class="sidebar">

<h2>Telemetry</h2>

<div class="menu">
<div>Dashboard</div>
<div>Sensors</div>
<div>Nodes</div>
<div>Logs</div>
</div>

</div>


<div class="main">

<div class="status">

<div class="statusBox">
<div class="statusTitle">NODE</div>
<div class="statusValue" id="node">-</div>
</div>

<div class="statusBox">
<div class="statusTitle">SYSTEM STATUS</div>
<div class="statusValue">ONLINE</div>
</div>

</div>


<div class="gaugeContainer">

<div class="gauge">
<div class="progress" id="tempGauge">0</div>
<div>Temperature</div>
</div>

<div class="gauge">
<div class="progress" id="humGauge">0</div>
<div>Humidity</div>
</div>

<div class="gauge">
<div class="progress" id="soilGauge">0</div>
<div>Soil</div>
</div>

<div class="gauge">
<div class="progress" id="lightGauge">0</div>
<div>Light</div>
</div>

</div>


<div class="graph">

<canvas id="chart"></canvas>

</div>


<div class="log" id="log">

Telemetry log started...

</div>


</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getDatabase, ref, onValue } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {

apiKey:"",

authDomain:"",

databaseURL:"",

projectId:"",

storageBucket:"loramonitoring.appspot.com",

messagingSenderId:"579777972279",

appId:""

};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const sensorRef = ref(database,"sensor_data");


let chart;

onValue(sensorRef,(snapshot)=>{

const data = snapshot.val();
if(!data) return;

const keys = Object.keys(data);
const last = data[keys[keys.length-1]];

document.getElementById("node").innerText = last.node;

updateGauge("tempGauge",last.temperature,50);
updateGauge("humGauge",last.humidity,100);
updateGauge("soilGauge",last.soil,100);
updateGauge("lightGauge",last.light,1000);


let labels=[];
let temps=[];

keys.forEach(k=>{
labels.push(k);
temps.push(data[k].temperature);
});

drawChart(labels,temps);


let log = document.getElementById("log");

log.innerHTML += `<br>${new Date().toLocaleTimeString()} | T:${last.temperature} H:${last.humidity}`;

log.scrollTop = log.scrollHeight;

});


function updateGauge(id,value,max){

let percent = value/max;
let deg = percent*360;

let el = document.getElementById(id);

el.style.background=`conic-gradient(#22c55e ${deg}deg,#1f2937 ${deg}deg)`;

el.innerText=value;

}


function drawChart(labels,data){

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{

type:'line',

data:{
labels:labels,
datasets:[{
data:data,
borderColor:'#38bdf8',
tension:0.3
}]
},

options:{
plugins:{legend:{display:false}}
}

});

}

</script>

</body>

</html>
